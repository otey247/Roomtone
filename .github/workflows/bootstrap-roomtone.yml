name: Materialize Roomtone assets

on:
  push:
    branches:
      - agent/build-roomtone-mobile-app

permissions:
  contents: write

jobs:
  assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Generate deterministic branded assets
        run: python scripts/generate-assets.py
      - name: Verify generated PNG files
        shell: bash
        run: |
          set -euo pipefail
          for asset in assets/icon.png assets/adaptive-icon.png assets/splash.png assets/favicon.png; do
            test -s "$asset"
          done
      - name: Commit generated assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Roomtone Build Agent"
          git config user.email "noreply@github.com"
          git add assets
          if git diff --cached --quiet; then
            echo "Assets are already current."
            exit 0
          fi
          git commit -m "build Roomtone branded assets"
          git push origin HEAD:${GITHUB_REF_NAME}
