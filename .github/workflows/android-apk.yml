name: Build Samsung S24 Ultra APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app.config.ts'
      - 'babel.config.cjs'
      - 'eas.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'
      - 'scripts/android/**'
      - 'tests/mobile/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'app.config.ts'
      - 'babel.config.cjs'
      - 'eas.json'
      - 'package.json'
      - 'src/**'
      - 'assets/**'
      - 'scripts/android/**'
      - 'tests/mobile/**'

permissions:
  contents: read

concurrency:
  group: roomtone-s24-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-apk:
    name: Standalone arm64 preview APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: true
      NODE_ENV: production
      ROOMTONE_APP_VARIANT: preview
      EXPO_PUBLIC_BUILD_CHANNEL: github-actions-s24-apk
      EXPO_PUBLIC_BUILD_ARCHITECTURE: arm64-v8a
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24.16.0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Define embedded build metadata
        shell: bash
        run: |
          echo "ROOMTONE_ANDROID_VERSION_CODE=$((100000 + GITHUB_RUN_NUMBER))" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_SHA=$GITHUB_SHA" >> "$GITHUB_ENV"
          echo "EXPO_PUBLIC_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm install --include=dev --no-audit --no-fund

      - name: Validate source
        run: npm run check

      - name: Generate Android project
        run: npx expo prebuild --clean --platform android --no-install

      - name: Build standalone Samsung S24 Ultra APK
        working-directory: android
        run: ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon --stacktrace

      - name: Verify and package APK
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_APK="android/app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          mkdir -p dist
          APK_NAME="roomtone-s24-ultra-preview-${GITHUB_RUN_NUMBER}.apk"
          cp "$SOURCE_APK" "dist/$APK_NAME"
          sha256sum "dist/$APK_NAME" | tee "dist/$APK_NAME.sha256"

          APKSIGNER="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "dist/$APK_NAME" | tee "dist/$APK_NAME.signature.txt"
          "$AAPT" dump badging "dist/$APK_NAME" | tee "dist/$APK_NAME.badging.txt"
          grep -q "package: name='com.otey247.roomtone.preview'" "dist/$APK_NAME.badging.txt"
          unzip -t "dist/$APK_NAME"

          cat > dist/build-metadata.json <<JSON
          {
            "artifact": "$APK_NAME",
            "packageName": "com.otey247.roomtone.preview",
            "commit": "$GITHUB_SHA",
            "versionCode": "$ROOMTONE_ANDROID_VERSION_CODE",
            "architecture": "arm64-v8a",
            "buildVariant": "release",
            "signing": "debug key for internal device testing only",
            "workflowRun": "$GITHUB_RUN_ID"
          }
          JSON

          {
            echo "## Samsung S24 Ultra APK"
            echo
            echo "- Artifact: \`$APK_NAME\`"
            echo "- Package: \`com.otey247.roomtone.preview\`"
            echo "- Version code: \`$ROOMTONE_ANDROID_VERSION_CODE\`"
            echo "- Architecture: \`arm64-v8a\`"
            echo "- Installation: \`adb install -r $APK_NAME\`"
            echo
            echo "This is a standalone, release-mode preview APK signed with a debug key for internal physical-device testing. It does not require Metro."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-s24-ultra-apk-${{ github.run_number }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
