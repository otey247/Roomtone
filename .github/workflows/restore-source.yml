name: Apply complete Roomtone source repair

on:
  push:
    branches:
      - agent/build-roomtone-mobile-app
    paths:
      - .github/workflows/restore-source.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: restore-roomtone-source
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply and validate verified source repair
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          fetch_blob_text() {
            local sha="$1"
            curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/git/blobs/${sha}" \
              | jq -r '.content' \
              | tr -d '\n' \
              | base64 --decode
          }

          : > /tmp/roomtone-repair.patch.gz.b64
          fetch_blob_text e0000667fc637bc1758c57a27e31f6c3cafda91a >> /tmp/roomtone-repair.patch.gz.b64
          fetch_blob_text d6564a8bea088ee95ee07bd25052c788cc78f27b >> /tmp/roomtone-repair.patch.gz.b64
          fetch_blob_text 791c29d82fdf3b82aa89591c55e85643c72a3424 >> /tmp/roomtone-repair.patch.gz.b64
          fetch_blob_text beae4a4aebfb74f5b8a3b21f94bdc25d10709d7e >> /tmp/roomtone-repair.patch.gz.b64
          fetch_blob_text ad76f014953798f5e88eff5a36e13d650d916b24 >> /tmp/roomtone-repair.patch.gz.b64

          echo "206a9764696510b22ab4d876b62c7230ac12ca473168d50885d4021cc2af6c8b  /tmp/roomtone-repair.patch.gz.b64" | sha256sum -c -
          base64 --decode /tmp/roomtone-repair.patch.gz.b64 > /tmp/roomtone-repair.patch.gz
          echo "c70e7e7db5baa151503f6aaa29117f1df593f803922e6bce1fb8db32c3c03797  /tmp/roomtone-repair.patch.gz" | sha256sum -c -
          gzip --test /tmp/roomtone-repair.patch.gz
          gzip -dc /tmp/roomtone-repair.patch.gz > /tmp/roomtone-repair.patch
          echo "3b9abf80f2a087985c1d7b93865212403b19e9c9b0a5c181c57b9a8cd2e0a4d4  /tmp/roomtone-repair.patch" | sha256sum -c -

          git apply --check /tmp/roomtone-repair.patch
          git apply /tmp/roomtone-repair.patch

          # Keep this temporary workflow for the source-repair commit. It is
          # deleted by the following user-authored commit so PR CI will run.
          git checkout HEAD -- .github/workflows/restore-source.yml

          node scripts/validate-repo.mjs
          npx tsc -p tsconfig.domain.json --noEmit
          node --experimental-strip-types --test tests/domain/*.test.ts
          git diff --check
          test "$(git status --short | wc -l | tr -d ' ')" -eq 21

      - name: Commit restored application
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/data/demo.ts \
            src/domain/export-html.ts \
            src/inference \
            src/infrastructure \
            src/screens \
            tests/domain
          git commit -m "restore complete Roomtone application tree"
          git push origin HEAD:agent/build-roomtone-mobile-app
