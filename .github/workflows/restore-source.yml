name: Capture Roomtone branch snapshot

on:
  push:
    branches:
      - agent/build-roomtone-mobile-app
    paths:
      - .github/workflows/restore-source.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Upload source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: roomtone-branch-source
          path: |
            .
            !.git
          include-hidden-files: true
          retention-days: 1
